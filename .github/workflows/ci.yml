name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: |
          if [ -f uv.lock ]; then
            uv sync --locked
          else
            echo "No uv.lock committed yet - run 'uv lock' locally and commit it."
            uv sync
          fi

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Unit tests
        run: |
          if git ls-files 'tests/*.py' | grep -q .; then
            uv run pytest
          else
            echo "No test files yet - unit tests land at stage 2."
          fi

      - name: Evals
        run: |
          if [ -f evals/runner.py ]; then
            uv run evals/runner.py --fixtures-only
          else
            echo "No eval runner yet - the eval harness lands at stage 5."
          fi
