[project]
name = "deadwax"
version = "0.1.0"
description = "An agentic music librarian with a deterministic validator, a repair loop, and a measured eval suite."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "David Koen" }]
keywords = ["llm", "agents", "evals", "rag", "mcp", "observability"]
dependencies = [
    "langchain>=1",
    "langchain-google-genai>=4",
    "langfuse>=4.15.2",
    "mcp>=2.3.0",
]

[project.scripts]
deadwax = "deadwax.cli:main"
deadwax-corpus = "deadwax.corpus:main"
deadwax-spotify = "deadwax.spotify:main"
deadwax-mcp = "deadwax.mcp.server:main"

[dependency-groups]
demo = [
    "gradio>=6.31.0",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deadwax"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "evals", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-third-party = ["mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["evals"]
addopts = "-ra"
