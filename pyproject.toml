[project]
name = "deadwax"
version = "0.1.0"
description = "An agentic music librarian with a deterministic validator, a repair loop, and a measured eval suite."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "David Koen" }]
keywords = ["llm", "agents", "evals", "rag", "mcp", "observability"]
dependencies = [
    "langchain>=1",
    "langchain-google-genai>=4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deadwax"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "evals", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
